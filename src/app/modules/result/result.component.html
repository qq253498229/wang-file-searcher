<nz-table #basicTable
          [nzData]="result()"
          nzTableLayout="fixed"
          [nzPageSize]="100" nzSize="small">
  <thead>
  <tr>
    <th [nzSortFn]="comparePath" nzWidth="360px">{{ 'result.name'|translate }}</th>
    <th [nzSortFn]="comparePath" nzWidth="60px">{{ 'result.kind'|translate }}</th>
    <th [nzSortFn]="compareUpdateAt" nzWidth="170px">{{ 'result.modified'|translate }}</th>
    <th nzWidth="75px">{{ 'result.operation'|translate }}</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let data of basicTable.data">
    <td nz-tooltip [nzTooltipTitle]="data.path" [nzEllipsis]="true">
      {{ data.file_name }}
    </td>
    <td>{{ data.extension }}</td>
    <td>{{ data.update_at|date:'yyyy-MM-dd HH:mm:ss' }}</td>
    <td>
      <button type="button" nz-button nzType="primary" nzSize="small"
              (click)="openInLocal(data)">
        {{ 'result.show'|translate }}
      </button>
    </td>
  </tr>
  </tbody>
</nz-table>
