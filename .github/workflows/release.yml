name: 发布

on:
  push:
    branches:
      - test-release

env:
  IS_CI: true

permissions:
  contents: write

jobs:
  MacOS:
    name: 发布macOS平台
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 打包
        run: |
          npm ci
          CI=true npm run tauri-build
      - name: 打印文件树
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          path: './src-tauri/target/release/bundle'
          depth: 2
      - run: cd ./src-tauri/target/release/bundle/dmg/ && zip -r 1so.app.zip 一搜.app
      - run: cd ./src-tauri/target/release/bundle/macos/ && zip 1so.dmg.zip 一搜_0.1.0_aarch64.dmg
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./src-tauri/target/release/bundle/dmg/1so.dmg.zip
            ./src-tauri/target/release/bundle/macos/1so.app.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Ubuntu:
    name: 发布Ubuntu平台
    runs-on: ubuntu-latest
    steps:
      - name: 添加tauri依赖
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 打包
        run: |
          npm ci
          npm run tauri-build
      - name: 打印文件树
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          path: './src-tauri/target/release/bundle'
          depth: 2
      - run: cd ./src-tauri/target/release/bundle/rpm/ && zip 1so.rpm.zip 一搜-0.1.0-1.x86_64.rpm
      - run: cd ./src-tauri/target/release/bundle/deb/ && zip 1so.deb.zip 一搜_0.1.0_amd64.deb
      - run: cd ./src-tauri/target/release/bundle/appimage/ && zip 1so.AppImage.zip 一搜_0.1.0_amd64.AppImage
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./src-tauri/target/release/bundle/rpm/1so.rpm.zip
            ./src-tauri/target/release/bundle/deb/1so.deb.zip
            ./src-tauri/target/release/bundle/appimage/1so.AppImage.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Windows:
    name: 发布Windows平台
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 打包
        run: |
          npm ci
          npm run tauri-build
      - name: 打印文件树
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          path: './src-tauri/target/release/bundle'
          depth: 2
      - run: cd ./src-tauri/target/release/bundle/msi/ && zip 1so.msi.zip 一搜_0.1.0_x64_zh-CN.msi
      - run: cd ./src-tauri/target/release/bundle/nsis/ && zip 1so.nsis.zip 一搜_0.1.0_x64-setup.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./src-tauri/target/release/bundle/msi/1so.msi.zip
            ./src-tauri/target/release/bundle/nsis/1so.nsis.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
